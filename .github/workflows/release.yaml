name: Bump version and release
on:
  workflow_dispatch:
  push:
    branches:
      - main
concurrency:
  group: release
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10.10'
      # The bumpversion docker action's image floated to Python 3.15, which bumpversion doesn't support
      - name: Bump version and tag
        run: |
          python -m pip install --no-cache-dir bump2version==1.0.1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bump2version patch
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tags: true
      - name: Build binaries
        run: |
          python -m pip install --no-cache-dir --upgrade pip wheel twine build setuptools
          python -m build
          python -m twine check dist/*
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
